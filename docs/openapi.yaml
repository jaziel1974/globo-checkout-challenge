openapi: 3.1.0
info:
  title: Checkout BFF
  version: 1.0.0
  description: >-
    API local de pré-checkout e checkout. A rota v2 usa Kafka internamente e aguarda o resultado
    por até cinco segundos. Cada cliente deve usar uma versão; não há proteção técnica entre v1 e v2.
servers:
  - url: http://localhost:8080
paths:
  /operations/pre-checkout:
    post:
      operationId: createPreCheckout
      summary: Cria um carrinho com snapshot de produtos e meios de pagamento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [products]
              properties:
                products:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [slug]
                    properties:
                      slug: { type: string, minLength: 1 }
            example:
              products:
                - { slug: premium }
      responses:
        '200':
          description: Carrinho criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreCheckoutResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '404': { $ref: '#/components/responses/ProductNotFound' }
        '424': { $ref: '#/components/responses/DependencyUnavailable' }

  /operations/checkout:
    post:
      operationId: checkoutV1
      summary: Executa checkout síncrono v1
      description: Use um carrinho criado pelo pré-checkout; após recusa, outra tentativa é permitida.
      requestBody: { $ref: '#/components/requestBodies/CheckoutRequest' }
      responses:
        '200':
          description: Pagamento aprovado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutResponse' }
        '400':
          description: Requisição inválida ou meio não permitido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FrontendError' }
        '404':
          description: Carrinho inexistente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FrontendError' }
        '409':
          description: Carrinho já aprovado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FrontendError' }
        '422': { $ref: '#/components/responses/PaymentDeclined' }
        '424': { $ref: '#/components/responses/DependencyUnavailable' }

  /v2/operations/checkout:
    post:
      operationId: checkoutV2
      summary: Executa checkout v2 com Kafka
      description: >-
        Aceita o mesmo corpo e retorna os mesmos contratos de sucesso e erro de negócio de v1.
        Aguarda até cinco segundos no total, incluindo publicação. Um 424 de resultado incerto não
        cancela o pagamento. Use carrinhos separados entre versões; não há safeguard v1/v2.
      requestBody: { $ref: '#/components/requestBodies/CheckoutRequest' }
      responses:
        '200':
          description: Pagamento aprovado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutResponse' }
        '400':
          description: Requisição inválida ou meio não permitido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FrontendError' }
        '404':
          description: Carrinho inexistente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FrontendError' }
        '409':
          description: Carrinho já aprovado ou tentativa v2 em andamento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FrontendError' }
              examples:
                alreadyApproved:
                  summary: Carrinho já aprovado
                  value:
                    displayType: BLOCK
                    errorCode: PAYMENT_ALREADY_APPROVED
                    cartId: <cartId>
                    frontendError:
                      code: P-1003
                      title: Carrinho já pago
                      description: Este carrinho já foi aprovado. Inicie outro checkout para uma nova compra.
                      primaryButton: { label: Escolher produtos, url: /checkout/produtos }
                paymentInProgress:
                  summary: Tentativa v2 em andamento
                  value:
                    displayType: INTERVENTION
                    errorCode: PAYMENT_IN_PROGRESS
                    cartId: <cartId>
                    frontendError:
                      code: P-1005
                      title: Pagamento em processamento
                      description: Já existe um pagamento em andamento para este carrinho. Tente novamente mais tarde.
                      primaryButton: { label: Tentar novamente, url: RETRY }
        '422': { $ref: '#/components/responses/PaymentDeclined' }
        '424': { $ref: '#/components/responses/DependencyUnavailable' }

components:
  requestBodies:
    CheckoutRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [cartId, paymentMethod]
            properties:
              cartId: { type: string, minLength: 1 }
              paymentMethod: { $ref: '#/components/schemas/PaymentSelection' }
          examples:
            card:
              value:
                cartId: <cartId>
                paymentMethod:
                  name: Cartão de Crédito
                  card: { holderName: Ana Souza, number: '4111111111114242', expiry: '12/28', cvv: '123' }
            pix:
              value:
                cartId: <cartId>
                paymentMethod: { name: Pix }

  schemas:
    PaymentSelection:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, examples: [Cartão de Crédito, Cartão de Débito, Pix] }
        card: { $ref: '#/components/schemas/Card' }
      description: Para Pix, omita card. O meio deve constar no snapshot do carrinho.
    Card:
      type: object
      required: [holderName, number, expiry, cvv]
      properties:
        holderName: { type: string, minLength: 1 }
        number: { type: string, pattern: '^\d{4,}$', description: Apenas dígitos; mínimo de quatro. }
        expiry: { type: string, pattern: '^(0[1-9]|1[0-2])/[0-9]{2}$', example: '12/28' }
        cvv: { type: string, pattern: '^\d+$', description: Apenas dígitos; mínimo de um. }
      description: Número e CVV são usados apenas na requisição e não são armazenados ou enviados ao Kafka.
    PreCheckoutResponse:
      type: object
      required: [cartId, products, paymentMethods]
      properties:
        cartId: { type: string }
        products:
          type: array
          items:
            type: object
            required: [slug, name, description, price, currency]
            properties:
              slug: { type: string }
              name: { type: string }
              description: { type: string }
              price: { type: number, format: double, example: 39.90 }
              currency: { type: string, example: BRL }
        paymentMethods:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
    CheckoutResponse:
      type: object
      required: [cartId, status, paidAt, payment, products]
      properties:
        cartId: { type: string }
        status: { type: string, enum: [APROVADO] }
        paidAt: { type: string, format: date-time }
        payment:
          oneOf:
            - type: object
              required: [method, lastDigits, amount, currency]
              properties:
                method: { type: string }
                lastDigits: { type: string, pattern: '^\d{4}$' }
                amount: { type: number, format: double }
                currency: { type: string, example: BRL }
            - type: object
              required: [method, pixCode, amount, currency]
              properties:
                method: { type: string, example: Pix }
                pixCode: { type: string, example: PIX-SIMULADO-<cartId> }
                amount: { type: number, format: double }
                currency: { type: string, example: BRL }
        products:
          type: array
          items:
            type: object
            required: [slug, name, price]
            properties:
              slug: { type: string }
              name: { type: string }
              price: { type: number, format: double }
    FrontendError:
      type: object
      required: [displayType, errorCode, cartId, frontendError]
      properties:
        displayType: { type: string, enum: [BLOCK, INTERVENTION] }
        errorCode: { type: string }
        cartId: { type: [string, 'null'] }
        frontendError:
          type: object
          required: [code, title, description, primaryButton]
          properties:
            code: { type: string }
            title: { type: string }
            description: { type: string }
            primaryButton: { $ref: '#/components/schemas/Button' }
            secondaryButton: { $ref: '#/components/schemas/Button' }
    PaymentInProgress:
      allOf:
        - { $ref: '#/components/schemas/FrontendError' }
      description: PAYMENT_IN_PROGRESS, HTTP 409; frontend code P-1005. Omite secondaryButton.
      example:
        displayType: INTERVENTION
        errorCode: PAYMENT_IN_PROGRESS
        cartId: <cartId>
        frontendError:
          code: P-1005
          title: Pagamento em processamento
          description: Já existe um pagamento em andamento para este carrinho. Tente novamente mais tarde.
          primaryButton: { label: Tentar novamente, url: RETRY }
    Button:
      type: object
      required: [label, url]
      properties:
        label: { type: string }
        url: { type: string }

  responses:
    InvalidRequest:
      description: Dados inválidos, errorCode INVALID_REQUEST.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FrontendError' }
    ProductNotFound:
      description: Produto inexistente, errorCode PRODUCT_NOT_FOUND.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FrontendError' }
    PaymentDeclined:
      description: Cartão terminado em 0002 recusado, errorCode PAYMENT_DECLINED.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FrontendError' }
    DependencyUnavailable:
      description: >-
        Dependência indisponível. Em v2, 424 com código S-1001 pode representar resultado incerto;
        o processamento não é cancelado e o pagamento pode ter sido aprovado.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FrontendError' }
