services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.2.2
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:29092,CONTROLLER://:29093,EXTERNAL://:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      KAFKA_OPTS: "-XX:-UseBASE64Intrinsics"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.2.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        set -eu
        for topic in checkout-v2-commands checkout-v2-failures; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
            --topic "$$topic" --partitions 1 --replication-factor 1 \
            --config cleanup.policy=delete --config retention.ms=604800000 \
            --config retention.bytes=-1 --config min.insync.replicas=1
        done
    restart: "no"

  simulator:
    build: ./payment-simulator
    environment:
      SERVER_PORT: 8081
    ports: ["8081:8081"]

  bff:
    build: ./checkout-bff
    environment:
      SERVER_PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PRODUCTS_BASE_URL: http://simulator:8081
      PAYMENT_METHODS_BASE_URL: http://simulator:8081
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CHECKOUT_KAFKA_COMMAND_TOPIC: checkout-v2-commands
    ports: ["8080:8080"]
    depends_on:
      redis:
        condition: service_healthy
      simulator:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully

  worker:
    build: ./checkout-worker
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CHECKOUT_KAFKA_COMMAND_TOPIC: checkout-v2-commands
      CHECKOUT_KAFKA_FAILURE_TOPIC: checkout-v2-failures
      CHECKOUT_KAFKA_CONSUMER_GROUP: checkout-v2-worker
    depends_on:
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
